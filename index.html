fy-content:space-between;align-items:center;border-top:1px solid #f1f2f4;margin-top:15px;padding-top:13px;font-size:11px;color:var(--muted)}.question-tools{display:flex;align-items:center;gap:10px}.small-btn{background:transparent;border:0;color:#7b7f8a;padding:3px}.answer-panel{margin-top:16px}.answer{padding:19px 21px 22px;min-height:230px;color:#414550;line-height:1.83;white-space:pre-wrap}.answer p{margin:0 0 11px}.answer strong{color:#292c34}.answer .placeholder{font-size:13px}.answer-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.spark{color:var(--blue)}.answer-actions{display:flex;gap:7px}.mini{border:1px solid var(--line);border-radius:8px;background:white;color:#737782;font-size:11px;padding:6px 9px}.right-stack{display:grid;gap:15px}.source-panel{padding:17px 18px}.source-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.source-title{font-weight:670}.status-pill{border-radius:99px;background:#f5f5f7;color:#8a8d96;font-size:10px;padding:4px 8px}.status-pill.on{color:#13885e;background:#e9f8f1}.source-row{display:flex;align-items:center;gap:11px;padding:11px 0}.source-icon{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:#f5f4ff;color:#6259ed}.source-icon svg{width:18px}.source-text{flex:1}.source-text b{display:block;font-size:12px}.source-text small{font-size:10px;color:var(--muted)}.toggle{width:34px;height:20px;border:0;border-radius:12px;background:#dfe1e6;padding:2px;transition:.2s}.toggle:after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:.2s}.toggle.active{background:var(--blue)}.toggle.active:after{transform:translateX(14px)}.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;color:#434650;font-size:12px;margin:3px 0 10px}.input-label{font-size:10px;color:var(--muted);display:block;margin:6px 0 4px}.field{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;outline:none;font-size:12px;color:#383b44;background:white}.field:focus,textarea:focus{border-color:#aaa4ff;box-shadow:0 0 0 3px #635bff12}.source-actions{display:flex;gap:7px;margin-top:4px}.primary{border:0;border-radius:9px;color:#fff;background:var(--blue);padding:9px 12px;font-weight:620;font-size:12px;box-shadow:0 4px 10px #635bff30}.secondary{border:1px solid var(--line);border-radius:9px;background:white;color:#5b5f69;padding:8px 11px;font-size:12px;font-weight:570}.wide{width:100%}.prompt-panel{padding:17px 18px}.prompt-title{font-weight:670;margin-bottom:4px}.prompt-sub{font-size:11px;color:var(--muted);margin-bottom:12px}.prompt-area{width:100%;min-height:112px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;line-height:1.6;color:#585c66;outline:none}.prompt-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.hint{font-size:10px;color:#a0a3ac}.manual-panel{padding:17px 18px}.manual-title{font-weight:670;margin-bottom:9px}.manual-row{display:flex;gap:7px}.manual-row .field{min-width:0}.manual-row button{white-space:nowrap}.footer{display:flex;justify-content:space-between;color:#a2a5ad;font-size:10px;margin-top:19px;padding:0 2px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#20232b;color:white;padding:10px 16px;border-radius:10px;font-size:12px;box-shadow:0 8px 28px #0002;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#17192355;display:none;place-items:center;padding:20px;z-index:20}.modal-backdrop.show{display:grid}.modal{background:#fff;border-radius:16px;padding:22px;width:min(440px,100%);box-shadow:0 18px 60px #1113}.modal h2{font-size:18px;margin:0 0 5px}.modal p{font-size:12px;color:var(--muted);margin:0 0 17px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    @media(max-width:980px){.app{grid-template-columns:68px minmax(0,1fr)}aside{padding:22px 10px;align-items:center}.brand{padding:0}.brand span,.side-label,.nav-item span,.user .user-copy{display:none}.nav{width:100%}.nav-item{justify-content:center;padding:11px}.side-bottom{width:100%}.user{justify-content:center;padding:15px 0 0}.cards{grid-template-columns:minmax(0,1fr) 290px}}
    @media(max-width:720px){.app{display:block}aside{display:none}main{padding:18px 14px}.cards{grid-template-columns:1fr}.heading{align-items:start;gap:10px;flex-direction:column}.session-info{align-self:flex-start}.topbar{margin-bottom:19px}.question{font-size:17px}.right-stack{grid-template-columns:1fr}.footer{gap:12px;flex-wrap:wrap}}
    .compact-toolbar{display:none}
    body.compact{background:#f7f7fa}
    body.compact .app{display:block;min-height:0}
    body.compact aside,body.compact .topbar,body.compact .heading,body.compact .right-stack,body.compact .footer{display:none!important}
    body.compact main{padding:10px;max-width:none}
    body.compact .compact-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;padding:0 2px}
    body.compact .compact-name{font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
    body.compact .compact-controls{display:flex;gap:6px}
    body.compact .compact-controls .mini{padding:6px 9px}
    body.compact .cards{display:block}
    body.compact .cards>div:first-child{display:grid;gap:9px}

    body.compact .question-body{min-height:0;padding:12px 14px}
    body.compact .question-label{margin-bottom:6px}
    body.compact .question{min-height:0;font-size:15px;line-height:1.55}
    body.compact .question-footer{margin-top:9px;padding-top:8px}
    body.compact .answer{min-height:0;max-height:330px;overflow:auto;padding:12px 14px;font-size:14px;line-height:1.35}
    body.compact .answer-panel>.panel-head:last-child .answer-meta:last-child{display:none}

    .protection-btn.enabled{color:#13885e;background:#e9f8f1;border-color:#d1f0e1}
    html,body{height:100%;overflow:hidden}
    body{background:#f4f5f7}
    .shell{height:100vh;width:100%;padding:14px 18px 16px;display:grid;grid-template-rows:34px minmax(0,1fr);gap:10px;max-width:none;margin:0}
    [hidden]{display:none!important}
    .main-actions{display:flex;align-items:center;justify-content:space-between}
    .main-tools{display:flex;align-items:center;gap:7px}
    .capture-indicator{display:flex;align-items:center;gap:9px;color:#737782;font-size:12px}
    .settings-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:#646975;background:#fff}
    .settings-icon:hover,.back-btn:hover{background:#f0efff;color:var(--blue)}
    .settings-icon svg{width:19px;height:19px}
    body.compact .shell{padding:8px;grid-template-rows:32px minmax(0,1fr);gap:7px}
    body.compact .capture-indicator{display:none}
    body.compact .main-actions{justify-content:flex-end}
    body.compact .interview-view{grid-template-rows:minmax(115px,auto) minmax(0,1fr) auto;gap:8px}
    body.compact .question-panel .panel-head,body.compact .answer-panel .panel-head{padding:8px 11px}
    body.compact .question-body{padding:9px 12px}
    body.compact .question{font-size:14px}
    body.compact .answer{font-size:14px;line-height:1.35;padding:12px 14px}
    body.compact .answer-status{padding:5px 12px}
    .interview-view{min-height:0;display:grid;grid-template-rows:minmax(145px,auto) minmax(0,1fr) auto;gap:11px}
    .question-panel,.answer-panel{min-height:0;margin:0;display:flex;flex-direction:column;overflow:hidden;border-radius:14px}
    .question-panel .panel-head,.answer-panel .panel-head{flex:none;padding:10px 15px}
    .question-body{padding:12px 16px;min-height:0;flex:1;display:flex;flex-direction:column}
    .question{font-size:16px;line-height:1.55;min-height:0;flex:1;overflow:auto}
    .question-footer{flex:none;margin-top:8px;padding-top:8px}
    .answer-panel{box-shadow:0 10px 34px #23283a0d}
    .answer{flex:1;min-height:0;max-height:none;overflow:auto;padding:16px 19px;font-size:14px;line-height:1.35;color:#353943}
    .answer-status{flex:none;padding:7px 16px;border-top:1px solid var(--line);font-size:10px;color:#969aa4}
    .answer-status{display:flex;align-items:center;justify-content:space-between;gap:8px}.qa-pager{display:flex;align-items:center;gap:8px}.qa-pager button{width:24px;height:22px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;color:#626674;font-size:13px;line-height:1}.qa-pager button:disabled{opacity:.35;cursor:default}.qa-page-label{min-width:42px;text-align:center}
    .capture-controls{display:flex;align-items:center;justify-content:space-between;padding:0 2px;color:#858994;font-size:12px}
    .capture-controls>div{display:flex;gap:8px}
    .capture-controls .primary,.capture-controls .secondary{min-width:94px}
    .settings-view{height:100%;min-height:0;display:grid;grid-template-rows:42px minmax(0,1fr);gap:12px}
    .settings-view[hidden]{display:none}
    .shell.settings-open{grid-template-rows:minmax(0,1fr)}
    .settings-header{display:flex;align-items:center;gap:10px}
    .settings-header h1{font-size:17px;letter-spacing:0;flex:1}
    .back-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#646975;font-size:20px;line-height:1}
    .settings-scroll{overflow:auto;display:grid;align-content:start;gap:11px;padding:1px 3px 10px}
    .settings-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}

    .settings-card .field,.settings-card .select{font-size:12px;padding:9px 10px;margin:0}

    .settings-card .prompt-area{min-height:150px;font-size:12px}
    .protection-card{display:flex;align-items:center;justify-content:space-between;gap:12px}
.protection-card p,.memory-card p{margin:0;color:var(--muted);font-size:11px}
    #protectionToggle{flex:none}
    .capture-controls .secondary:disabled{opacity:.45;cursor:default}
    @media(max-width:560px){.shell{padding:9px}.answer{padding:13px;font-size:14px;line-height:1.35}.question-body{padding:10px 12px}}
  </style>

<body>
<main class="shell">
  <div class="main-actions"><span class="capture-indicator"><i class="live-dot" id="liveDot"></i><span id="captureStatus">未采集</span></span><div class="main-tools"><button class="mini" id="compactBtn" title="缩成置顶小窗">小窗</button><button class="settings-icon" id="settingsBtn" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 3.1-.2-.1a1.8 1.8 0 0 0-1.9.1l-.1.1h-3.6l-.1-.2a1.8 1.8 0 0 0-1.5-1.1 1.8 1.8 0 0 0-1.6.6l-.1.1-3.1-1.8.1-.2a1.8 1.8 0 0 0-.1-1.9l-.1-.1v-3.6l.2-.1a1.8 1.8 0 0 0 1.1-1.5 1.8 1.8 0 0 0-.6-1.6l-.1-.1 1.8-3.1.2.1a1.8 1.8 0 0 0 1.9-.1l.1-.1h3.6l.1.2a1.8 1.8 0 0 0 1.5 1.1 1.8 1.8 0 0 0 1.6-.6l.1-.1 3.1 1.8-.1.2a1.8 1.8 0 0 0 .1 1.9l.1.1z" transform="translate(-1 -1)"/></svg></button></div></div>
  <section id="interviewView" class="interview-view">
    <section class="panel question-panel"><div class="panel-head"><div class="panel-title">问题</div><div class="head-meta" id="asrState">等待音频</div></div><div class="question-body"><div class="question placeholder" id="question">开始采集后，识别到的问题会显示在这里。</div><div class="question-footer"><span id="questionTime"></span><div class="question-tools"><span id="confidence"></span><button class="small-btn" id="copyQuestion">复制</button></div></div></div></section>
    <section class="panel answer-panel"><div class="panel-head"><div class="panel-title">回答</div><div class="answer-actions"><button class="mini" id="regenerate">重新生成</button><button class="mini" id="copyAnswer">复制</button></div></div><div class="answer" id="answer"><span class="placeholder">识别到问题后，回答会显示在这里。</span></div><div class="answer-status"><span id="modelStatus">待命</span><div class="qa-pager"><button id="prevQA" title="上一条问答" aria-label="上一条问答">←</button><span id="qaPageLabel" class="qa-page-label">实时</span><button id="nextQA" title="下一条问答" aria-label="下一条问答">→</button></div></div></section>
    <div class="capture-controls"><span id="clock">00:00</span><div><button class="secondary" id="stopBtn" disabled>结束采集</button><button class="primary" id="startBtn">开始采集</button></div></div>
  </section>
  <section id="settingsView" class="settings-view" hidden>
    <header class="settings-header"><button class="back-btn" id="backBtn" aria-label="返回">←</button><h1>设置</h1><button class="primary" id="saveSettings">保存</button></header>
    <div class="settings-scroll">
      <section class="settings-card"><h2>回答模型</h2><label class="input-label" for="deepseekKey">DeepSeek API Key</label><input class="field" id="deepseekKey" type="password" autocomplete="off" placeholder="sk-…"/><label class="input-label" for="model">模型名称</label><input class="field" id="model" placeholder="deepseek-flash"/></section>
      <section class="settings-card"><h2>语音识别</h2><label class="input-label" for="provider">服务</label><select class="select" id="provider"><option value="tencent">腾讯云实时 ASR</option><option value="funasr">本地 FunASR（CPU）</option><option value="aliyun">阿里云 Paraformer 流式</option></select><label class="input-label" for="asrGateway">本地 ASR 网关地址</label><input class="field" id="asrGateway" placeholder="ws://127.0.0.1:8765/asr"/><label class="input-label" for="asrKeywords">技术关键词（每行一个）</label><textarea class="prompt-area" id="asrKeywords" placeholder="Vite&#10;Vue&#10;TinyMCE&#10;TypeScript&#10;React"></textarea><div class="prompt-sub">最多128个，默认权重8；可写 Vue|10 调高权重。保存后下次采集生效。</div></section>
      <section class="settings-card"><h2>回答提示词</h2><textarea class="prompt-area" id="prompt">你是一位资深求职面试教练。请根据面试官的问题，给出简洁、自然、适合口头表达的中文回答建议。优先使用 STAR 结构；不要编造用户经历、数据或技能，缺少背景时用方括号标出可替换内容。先给出可直接说出口的回答，再用一句话说明答题思路。控制在 150～250 字。</textarea></section>
      <section class="settings-card memory-card"><div><h2>本场上下文</h2><p id="memoryStatus">本场记忆只保存在运行期间</p></div><button class="secondary" id="clearMemory">清空记忆</button></section>
      <section class="settings-card protection-card"><div><h2>屏幕共享保护</h2><p>从受支持的屏幕捕获中排除应用窗口</p></div><button class="toggle active" id="protectionToggle" aria-label="切换屏幕共享保护"></button></section>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let stream=null,recorder=null,asrSocket=null,elapsed=0,timer=null,askController=null,questionFinal='',activeAsr=false,stopping=false;
let conversationMemory=[],pendingQuestions=[],processingQuestions=false,activeQuestion='',lastQueuedQuestion='',lastQueuedAt=0,currentQuestionContext=[],historyPage=-1,currentAnswer='',currentAnswerStatus='待命';
let captureProtection=window.zhimianDesktop?.platform==='win32';
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)};
const cfg=()=>JSON.parse(localStorage.getItem('zhimian-config')||'{}');
function loadPrefs(){const c=cfg();if(c.prompt)$('#prompt').value=c.prompt;if(c.provider)$('#provider').value=c.provider;if(c.deepseekKey)$('#deepseekKey').value=c.deepseekKey;if(c.model)$('#model').value=c.model;if(c.asrKeywords)$('#asrKeywords').value=c.asrKeywords;$('#asrGateway').value=c.asrGateway||'ws://127.0.0.1:8765/asr';$('#protectionToggle').classList.toggle('active',captureProtection);updateMemoryStatus()}
function updateMemoryStatus(){const count=conversationMemory.length;$('#memoryStatus').textContent=count?`本场保留最近 ${count} 轮问答；只保存在运行期间`:'尚无问答记忆；内容只保存在运行期间';$('#clearMemory').disabled=count===0||processingQuestions;updateHistoryControls()}
function updateHistoryControls(){const count=conversationMemory.length;$('#qaPageLabel').textContent=historyPage<0?'实时':`${historyPage+1}/${count}`;$('#prevQA').disabled=!count||(historyPage===0);$('#nextQA').disabled=historyPage<0}
function normalizeAnswer(text){return String(text||'').replace(/\r\n/g,'\n').replace(/\n[ \t]*\n+/g,'\n').trim()}
function showQaPage(index){if(index<0){historyPage=-1;$('#question').textContent=questionFinal||'等待识别问题';$('#question').classList.toggle('placeholder',!questionFinal);$('#answer').textContent=currentAnswer||'等待回答';$('#answer').classList.toggle('placeholder',!currentAnswer);$('#questionTime').textContent=questionFinal?'刚刚识别':'';$('#confidence').textContent=questionFinal?'识别完成':'';$('#modelStatus').textContent=currentAnswerStatus}else{historyPage=Math.max(0,Math.min(index,conversationMemory.length-1));const item=conversationMemory[historyPage];$('#question').textContent=item.question;$('#question').classList.remove('placeholder');$('#answer').textContent=normalizeAnswer(item.answer);$('#answer').classList.remove('placeholder');$('#questionTime').textContent='历史问答';$('#confidence').textContent=`第 ${historyPage+1} 条`;$('#modelStatus').textContent='历史记录'}$('#regenerate').disabled=historyPage>=0||processingQuestions||!questionFinal;updateHistoryControls()}
function moveQaPage(direction){if(!conversationMemory.length)return;if(historyPage<0){if(direction<0)showQaPage(conversationMemory.length-1);return}const next=historyPage+direction;if(next<0)return;if(next>=conversationMemory.length){showQaPage(-1);return}showQaPage(next)}
function displayedQuestion(){return historyPage>=0?conversationMemory[historyPage]?.question:questionFinal}
function updateClock(){elapsed++;$('#clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')}
async function startCapture(){
  if(!navigator.mediaDevices?.getDisplayMedia){toast('当前环境不支持系统音频共享，请使用 Windows 桌面版');return}
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:window.zhimianDesktop?.isDesktop?true:{echoCancellation:false,noiseSuppression:false,sampleRate:16000}});const audio=stream.getAudioTracks();if(!audio.length){stream.getTracks().forEach(t=>t.stop());stream=null;toast('没有获取到系统音频，请确认 Windows 播放设备正在输出声音');return}
    audio.forEach(t=>t.onended=stopCapture);$('#liveDot').classList.add('on');$('#captureStatus').textContent='正在采集';$('#asrState').textContent='音频已接入';$('#startBtn').disabled=true;$('#stopBtn').disabled=false;timer=setInterval(updateClock,1000);
    const c=cfg(),pending=[];c.asrGateway=c.asrGateway||$('#asrGateway').value.trim()||'ws://127.0.0.1:8765/asr';try{const ws=new WebSocket(c.asrGateway);asrSocket=ws;ws.onopen=()=>{if(asrSocket!==ws||stopping)return;ws.send(JSON.stringify({type:'start',provider:c.provider||$('#provider').value,format:'audio/webm;codecs=opus',sampleRate:16000,hotwords:c.asrKeywords||$('#asrKeywords').value}));for(const chunk of pending){if(ws.readyState===WebSocket.OPEN)ws.send(chunk)}pending.length=0;$('#asrState').textContent='识别中';};ws.onmessage=e=>{if(asrSocket!==ws)return;try{const m=JSON.parse(e.data);if(m.type==='partial'){if(historyPage<0){$('#question').textContent=m.text;$('#question').classList.remove('placeholder')}$('#asrState').textContent='识别中'}else if(m.type==='final'&&m.text){setQuestion(m.text);$('#asrState').textContent='已识别'}else if(m.type==='done'){try{ws.close()}catch{}}else if(m.type==='error'){toast(m.message||'ASR 识别失败');$('#asrState').textContent='识别失败'}}catch{}};ws.onerror=()=>{if(asrSocket===ws)toast('ASR 网关连接失败，请检查本地网关')};ws.onclose=()=>{if(asrSocket===ws){asrSocket=null;if(stream)$('#asrState').textContent='ASR 已断开'}}}catch{toast('ASR 网关地址无效')}
    const audioStream=new MediaStream(stream.getAudioTracks()),mime='audio/webm;codecs=opus',socket=asrSocket;recorder=new MediaRecorder(audioStream,MediaRecorder.isTypeSupported?.(mime)?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data.size){if(socket?.readyState===WebSocket.OPEN)socket.send(e.data);else if(socket&&pending.length<25)pending.push(e.data)}};recorder.start(200);
    toast('Windows 系统音频与 ASR 网关已启动');
  }catch(e){if(e.name!=='NotAllowedError')toast('音频采集失败：'+e.message)}
}
function stopCapture(){if(stopping)return;stopping=true;const socket=asrSocket,rec=recorder;const reset=()=>{if(stream){stream.getTracks().forEach(t=>{t.onended=null;t.stop()});stream=null}recorder=null;stopping=false;clearInterval(timer);timer=null;$('#liveDot').classList.remove('on');$('#captureStatus').textContent='未采集';$('#asrState').textContent='等待音频';$('#startBtn').disabled=false;$('#stopBtn').disabled=true};const finish=()=>{if(socket&&socket.readyState===WebSocket.OPEN){socket.send(JSON.stringify({type:'stop'}));const waitMs=cfg().provider==='funasr'?300000:5000;setTimeout(()=>{if(socket.readyState===WebSocket.OPEN)socket.close()},waitMs)}else if(socket){socket.close()}reset()};if(rec&&rec.state!=='inactive'){rec.addEventListener('stop',finish,{once:true});rec.stop()}else finish()}
function renderQuestion(text){questionFinal=text;currentAnswer='';currentAnswerStatus='待命';historyPage=-1;const q=$('#question');q.textContent=text;q.classList.remove('placeholder');$('#answer').textContent='';$('#answer').classList.remove('placeholder');$('#questionTime').textContent='刚刚识别';$('#confidence').textContent='识别完成';updateHistoryControls()}
function mergeQuestionParts(parts){let merged='';for(const raw of parts){const part=String(raw||'').trim();if(!part)continue;if(!merged){merged=part;continue}if(part===merged||merged.endsWith(part)||merged.includes(part))continue;if(part.startsWith(merged)){merged=part;continue}let overlap=0;for(let n=Math.min(80,merged.length,part.length);n>0;n--){if(merged.slice(-n)===part.slice(0,n)){overlap=n;break}}const addition=part.slice(overlap);if(!addition)continue;merged+=/[。！？.!?]$/.test(merged)?'\n补充：'+addition:/[，,、；;：:]$/.test(merged)?addition:'，'+addition}return merged}
function setQuestion(text){const clean=String(text||'').trim(),key=clean.replace(/\s+/g,' '),now=Date.now();if(!key||(key===lastQueuedQuestion&&now-lastQueuedAt<5000))return;if(processingQuestions&&activeQuestion){const merged=mergeQuestionParts([activeQuestion,...pendingQuestions,clean]);if(merged.replace(/\s+/g,' ')===activeQuestion.replace(/\s+/g,' '))return;activeQuestion=merged;pendingQuestions=[merged];lastQueuedQuestion=key;lastQueuedAt=now;renderQuestion(merged);currentAnswerStatus='生成中';$('#modelStatus').textContent='识别到补充内容，正在合并问题…';askController?.abort();return}lastQueuedQuestion=key;lastQueuedAt=now;pendingQuestions.push(clean);void processQuestionQueue()}
async function processQuestionQueue(){if(processingQuestions)return;processingQuestions=true;updateMemoryStatus();try{while(pendingQuestions.length){const q=pendingQuestions.shift();activeQuestion=q;if(!cfg().deepseekKey){pendingQuestions=[];renderQuestion(q);toast('请先在设置中填写 DeepSeek API Key');showSettings();break}renderQuestion(q);currentQuestionContext=conversationMemory.slice();await generate(q,currentQuestionContext,true);activeQuestion=''}}finally{processingQuestions=false;activeQuestion='';updateMemoryStatus();$('#regenerate').disabled=!questionFinal}}
async function generate(q,contextTurns=currentQuestionContext,remember=false){const c=cfg();if(!c.deepseekKey){toast('请先在设置中填写 DeepSeek API Key');showSettings();return false}if(askController)askController.abort();askController=new AbortController();currentAnswer='';currentAnswerStatus='生成中';if(historyPage<0)$('#answer').textContent='';$('#modelStatus').textContent='生成中';$('#regenerate').disabled=true;
  const systemPrompt=($('#prompt').value||'').trim()+'\n\n对话上下文规则：结合前面的面试问题和回答理解当前问题。若当前问题是追问、补充或提示，承接前文并保持事实一致；若切换主题，则回答新主题。不要编造候选人的经历、数据或事实，不确定时用条件化表达。';
  const messages=[{role:'system',content:systemPrompt},...contextTurns.slice(-12).flatMap(turn=>[{role:'user',content:'面试官的问题：'+turn.question},{role:'assistant',content:normalizeAnswer(turn.answer)}]),{role:'user',content:'面试官的问题：'+q+'\n\n请按提示词要求给出参考回答。'}];
  try{const response=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.deepseekKey},body:JSON.stringify({model:c.model||'deepseek-flash',stream:true,messages}),signal:askController.signal});if(!response.ok)throw new Error('API 返回 '+response.status+'：'+(await response.text()).slice(0,160));
    const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',answerText='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw),delta=j.choices?.[0]?.delta?.content;if(delta){answerText+=delta;currentAnswer=normalizeAnswer(answerText);if(historyPage<0)$('#answer').textContent=currentAnswer}}catch{}}}currentAnswerStatus='已完成';if(historyPage<0)$('#modelStatus').textContent='已完成';if(remember&&answerText.trim()){const questionKey=q.trim().replace(/\s+/g,' ');conversationMemory=conversationMemory.filter(turn=>turn.question.trim().replace(/\s+/g,' ')!==questionKey);if(conversationMemory.length===3&&historyPage>=0)historyPage=Math.max(0,historyPage-1);conversationMemory.push({question:q.trim(),answer:normalizeAnswer(answerText)});if(conversationMemory.length>3)conversationMemory.shift();updateMemoryStatus();if(historyPage>=0)showQaPage(historyPage)}return true;
  }catch(e){if(e.name!=='AbortError'){currentAnswer='生成失败：'+e.message;currentAnswerStatus='生成失败';if(historyPage<0){$('#answer').textContent=currentAnswer;$('#modelStatus').textContent='生成失败'}}return false}finally{$('#regenerate').disabled=historyPage>=0||processingQuestions||!questionFinal}}
function clearMemory(){if(processingQuestions){toast('请等当前回答生成完成后再清空');return}conversationMemory=[];historyPage=-1;pendingQuestions=[];lastQueuedQuestion='';lastQueuedAt=0;currentQuestionContext=[];updateMemoryStatus();showQaPage(-1);toast('本场记忆已清空')}
function showSettings(){if(document.body.classList.contains('compact'))setCompactMode(false);loadPrefs();$('.shell').classList.add('settings-open');$('#interviewView').hidden=true;$('#settingsView').hidden=false}
function showInterview(){$('#settingsView').hidden=true;$('#interviewView').hidden=false;$('.shell').classList.remove('settings-open')}
async function saveSettings(){const c=cfg();c.deepseekKey=$('#deepseekKey').value.trim();c.model=$('#model').value.trim()||'deepseek-flash';c.provider=$('#provider').value;c.asrGateway=$('#asrGateway').value.trim()||'ws://127.0.0.1:8765/asr';c.asrKeywords=$('#asrKeywords').value;c.prompt=$('#prompt').value;const desired=$('#protectionToggle').classList.contains('active');if(window.zhimianDesktop?.setContentProtection&&desired!==captureProtection){try{const applied=await window.zhimianDesktop.setContentProtection(desired);if(applied!==desired)throw new Error('系统未能应用窗口保护');captureProtection=desired}catch(e){toast('屏幕共享保护切换失败：'+e.message);return}}localStorage.setItem('zhimian-config',JSON.stringify(c));showInterview();toast('设置已保存')}
async function setCompactMode(compact){if(document.body.classList.contains('compact')===compact)return;document.body.classList.toggle('compact',compact);$('#compactBtn').textContent=compact?'还原':'小窗';if(window.zhimianDesktop?.setCompact){try{if(!await window.zhimianDesktop.setCompact(compact))throw new Error('窗口切换失败')}catch(e){document.body.classList.toggle('compact',!compact);$('#compactBtn').textContent=compact?'小窗':'还原';toast(e.message)}}}
$('#settingsBtn').onclick=showSettings;$('#backBtn').onclick=showInterview;$('#saveSettings').onclick=saveSettings;$('#protectionToggle').onclick=()=>$('#protectionToggle').classList.toggle('active');$('#clearMemory').onclick=clearMemory;$('#prevQA').onclick=()=>moveQaPage(-1);$('#nextQA').onclick=()=>moveQaPage(1);$('#compactBtn').onclick=()=>setCompactMode(!document.body.classList.contains('compact'));$('#startBtn').onclick=startCapture;$('#stopBtn').onclick=stopCapture;$('#regenerate').onclick=()=>questionFinal&&!processingQuestions&&historyPage<0&&generate(questionFinal,currentQuestionContext,false);$('#copyQuestion').onclick=()=>displayedQuestion()&&navigator.clipboard?.writeText(displayedQuestion()).then(()=>toast('问题已复制'));$('#copyAnswer').onclick=()=>navigator.clipboard?.writeText($('#answer').textContent).then(()=>toast('回答已复制'));window.addEventListener('keydown',e=>{if(e.target instanceof HTMLElement&&(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable))return;if(!$('#settingsView').hidden)return;if(e.key==='ArrowLeft'){e.preventDefault();moveQaPage(-1)}else if(e.key==='ArrowRight'){e.preventDefault();moveQaPage(1)}});window.addEventListener('beforeunload',stopCapture);loadPrefs();
</script>
